name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Structural tests
        run: pnpm test:structural

      - name: Planning audit
        run: pnpm audit:planning

      - name: Verify presets
        run: pnpm verify-presets

      - name: Build
        run: pnpm build

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Start creator app
        run: pnpm dev --host 127.0.0.1 > /tmp/gfx-vite.log 2>&1 &

      - name: Start flag-enabled Chrome
        run: >-
          "${{ steps.chrome.outputs.chrome-path }}"
          --headless=new
          --no-sandbox
          --disable-dev-shm-usage
          --enable-unsafe-webgpu
          --use-angle=swiftshader
          --enable-blink-features=CanvasDrawElement
          --remote-debugging-port=9223
          --user-data-dir=/tmp/gfx-chrome
          about:blank > /tmp/gfx-chrome.log 2>&1 &

      - name: Browser render test
        run: pnpm test:browser
