name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Structural tests
        run: pnpm test:structural

      - name: Planning audit
        run: pnpm audit:planning

      - name: Verify presets
        run: pnpm verify-presets

      - name: Build
        run: pnpm build

      # The browser render test (`pnpm test:browser`) is not run here: on a
      # GitHub-hosted runner its WebGPU capture came back blank (2026-10-09),
      # most likely because the runner has no GPU. Run it on a machine with one.
