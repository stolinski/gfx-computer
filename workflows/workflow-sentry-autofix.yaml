id: a9ae4016-7b31-4332-9361-e3ddb670f28c
name: sentry-autofix
description: >-
  Every six hours: pick one unattempted unresolved Sentry issue, gather its
  evidence with the sentry CLI (Seer explain/plan included, no reproduction
  required), fix it in an isolated worktree, verify with the repo's checks,
  integrate onto dev, resolve the issue, and close its Dex task. Failed
  attempts stay visible as open Dex repair tasks, which also stops re-attempts.
tags: { lane: sentry }
trigger:
  schedule: '0 */6 * * *'
jobs:
  - name: main
    description: One bounded evidence-to-resolution repair attempt
    steps:
      - name: repair
        description: Agent-driven fix of one Sentry issue from event evidence
        task:
          type: model_method
          modelIdOrName: gfx-sentry-agent
          methodName: invokeAndParse
          inputs:
            cwd: /Users/scotttolinski/Sites/properties/gfx-computer
            tags: { lane: sentry }
            prompt: |
              You are the GFX Sentry repair agent. Fix at most ONE unresolved
              Sentry issue this run, end to end. Work from the repo root
              /Users/scotttolinski/Sites/properties/gfx-computer (the sentry CLI
              auto-detects org/project scott-tolinski-projects/gfx-computer there).

              1. `sentry issue list --query "is:unresolved"`. Also run
                 `dex list --json` and skip any issue that already has an open
                 Dex repair task: for GFX-COMPUTER-<n>, a task named
                 "Repair GFX-COMPUTER-<n> from Sentry evidence" — or the
                 pre-rename "Repair SUPERS-<n> from Sentry evidence" with the
                 same <n> (the 2026-08-31 Sentry slug rename changed the
                 prefix, never the counter). An open task means a previous
                 attempt failed and a human should look. If nothing is left to
                 attempt, print the JSON from step 7 with outcome
                 "nothing-to-do" and stop.
              2. Pick the most impactful remaining issue. Create its Dex task
                 (`dex create "Repair GFX-COMPUTER-<n> from Sentry evidence" --description ...`,
                 reusing an existing one if present) and `dex start` it.
              3. Gather evidence — the original event is enough, never block on
                 reproducing: `sentry issue view GFX-COMPUTER-<n>`,
                 `sentry issue explain GFX-COMPUTER-<n>`, `sentry issue plan GFX-COMPUTER-<n>`.
              4. Fix it in an isolated worktree, never in the primary checkout.
                 While the WebMCP Challenge runs, `dev` is the integration
                 branch and `main` is frozen: never commit to or push `main`.
                 `git worktree add -b sentry/GFX-COMPUTER-<n> /Users/scotttolinski/.worktrees/gfx-computer/gfx-computer-sentry-GFX-COMPUTER-<n> dev`
                 (reuse and rebase onto dev if it already exists), then
                 `SHARP_IGNORE_GLOBAL_LIBVIPS=1 CI=true pnpm install` there.
                 Implement the smallest credible fix per the worktree's CLAUDE.md.
                 No speculative test files — add a test only when it pins the
                 actual bug you fixed.
              5. Verify in the worktree: `pnpm check` and `pnpm test` must be
                 green. If the fix touched preset, pack, or pipeline files, also
                 run `node --experimental-strip-types scripts/verify-presets.ts --affected --changed-paths-json '<json array of changed paths>'`
                 — never `--all`. Commit as ONE commit.
              6. Integrate and close out: cherry-pick that commit onto dev in
                 the primary checkout, remove the worktree
                 (`git worktree remove /Users/scotttolinski/.worktrees/gfx-computer/gfx-computer-sentry-GFX-COMPUTER-<n>`),
                 `sentry issue resolve GFX-COMPUTER-<n>`, and
                 `dex complete <taskId> --result "<what changed>" --commit <sha>`.
              7. If any step fails, leave the Dex task open with what you
                 learned in its description, leave the Sentry issue unresolved,
                 and report honestly. Always end by printing exactly one JSON
                 object: {"outcome": "fixed" | "attempted" | "nothing-to-do",
                 "issue": "GFX-COMPUTER-<n>" | null, "dexTask": "<id>" | null,
                 "headSha": "<sha>" | null, "summary": "<one sentence>"}.
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
