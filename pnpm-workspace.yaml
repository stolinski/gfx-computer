allowBuilds:
  # Only pulled in by @sentry/vite-plugin for build-time sourcemap upload —
  # unused here (local-only dev; the standalone sentry CLIs are installed
  # globally), so its binary-download postinstall stays off.
  '@sentry/cli': false
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@drop-in/graffiti@4.28.0'
  - '@foleyjs/core@2.7.0'
  - miniflare@5.20261023.0-beta
  - wrangler@4.153.0
onlyBuiltDependencies:
  - workerd
  - sharp
  - esbuild
patchedDependencies:
  '@sveltejs/kit@2.69.2': patches/@sveltejs__kit@2.69.2.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
